<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Variables y Tipos de Datos</title>
</head>

<body class="p-2 sm:p-4 min-h-screen overflow-y-auto">

<details class="text-sm mb-2">
    <summary class="bg-pink-800 text-white p-2">ENUNCIADO</summary>
    <p> Responde los datos del formulario y termina la funcion Calcular()</p>
</details>

<details class="text-sm mb-2">
    <summary class="text-pink-800 font-bold">
        Tipos de Datos en JavaScript
    </summary>

    <div class="flex flex-col sm:flex-row gap-4">
        <div class="flex-1 border-1">
            <p class="px-4 py-2"><strong>Primitivos</strong></p>
        </div>

        <div class="flex-1 border-1">
            <p class="px-4 py-2"><strong>Compuestos</strong></p>
        </div>
    </div>
</details>

<div>
    <details>
        <summary class="text-pink-800 font-bold">
            Ordenamiento del codigo de los programas en JavaScript
        </summary>
    </details>
</div>

<form class="w-full sm:w-3/4 mx-auto p-4 sm:p-6 m-2 bg-gray-100 rounded-lg shadow-md max-h-[95vh] overflow-y-auto">
    
    <h1 class="text-pink-800 font-bold text-xl mb-4">
        Gastos de la casa
    </h1>

    <p class="font-bold mb-4">
        Todo lo que viene del HTML es un string
    </p>

    <div class="flex flex-col sm:flex-row sm:items-center mb-3">
        <label class="w-full sm:w-1/3 sm:text-right pr-4" for="nombre">Tu nombre:</label>
        <input class="w-full sm:w-2/3 border rounded px-2 py-1" type="text" id="nombre">
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center mb-4">
        <label class="w-full sm:w-1/3 sm:text-right pr-4" for="apellido">Apellido(s):</label>
        <input class="w-full sm:w-2/3 border rounded px-2 py-1" type="text" id="apellido">
    </div>

    <fieldset class="border border-pink-800 p-4 mb-4">
        <legend class="bg-pink-800 text-white px-3 py-1">
            Gastos fijos
        </legend>

        <div class="flex flex-col sm:flex-row sm:items-center mb-2">
            <label class="w-full sm:w-1/3 sm:text-right pr-4">Internet:</label>
            <input class="w-full sm:w-2/3 border rounded px-2 py-1 text-pink-800" id="internet" value="43" type="number">
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center mb-2">
            <label class="w-full sm:w-1/3 sm:text-right pr-4">Luz:</label>
            <input class="w-full sm:w-2/3 border rounded px-2 py-1" id="luz" type="text">
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center mb-2">
            <label class="w-full sm:w-1/3 sm:text-right pr-4">Agua:</label>
            <input class="w-full sm:w-2/3 border rounded px-2 py-1" id="agua" type="text">
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center mb-2">
            <label class="w-full sm:w-1/3 sm:text-right pr-4">Gas:</label>
            <input class="w-full sm:w-2/3 border rounded px-2 py-1" id="gas" type="text">
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center">
            <label class="w-full sm:w-1/3 sm:text-right pr-4">Alquiler:</label>
            <input class="w-full sm:w-2/3 border rounded px-2 py-1" id="alquiler" type="text">
        </div>
    </fieldset>

    <button 
        id="btnCalcular"
        type="button"
        onclick="calcular()"
        class="w-full sm:w-auto border border-pink-800 text-pink-800 px-4 py-2 rounded hover:bg-pink-800 hover:text-white transition">
        Calcular Gastos
    </button>

    <p id="totalGastos" class="mt-4 font-semibold border border-pink-800 p-2 h-10"></p>

</form>

<script src="app.js"></script>

</body>
</html>
